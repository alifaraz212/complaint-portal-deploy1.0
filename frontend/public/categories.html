<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories — Admin</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <h1>Admin — Complaint Portal</h1>
        <div class="nav-links">
            <a href="/admin-dashboard.html">Dashboard</a>
            <a href="/admin-complaints.html">All Complaints</a>
            <a href="/categories.html">Categories</a>
            <button onclick="logout()" class="btn btn-danger">Logout</button>
        </div>
    </nav>

    <div class="container" style="max-width: 900px;">
        <div class="page-header">
            <h2>Category Management</h2>
        </div>

        <!-- Add new category -->
        <div class="card">
            <h3>Add New Category</h3>
            <form id="addCategoryForm">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="newName" required placeholder="e.g. Billing, Technical Support">
                </div>
                <div class="form-group">
                    <label>Description (optional)</label>
                    <textarea id="newDescription" placeholder="Brief description of this category..."></textarea>
                </div>
                <div class="form-footer">
                    <button type="submit" class="btn btn-primary">Add Category</button>
                </div>
            </form>
        </div>

        <!-- Categories list -->
        <div class="card">
            <h3>All Categories</h3>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="categoriesTable"></tbody>
            </table>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/categories.js"></script>
</body>
</html>
